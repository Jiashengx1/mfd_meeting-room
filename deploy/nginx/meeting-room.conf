server {
    listen 80;
    listen [::]:80;
    server_name srrshywk.online www.srrshywk.online meeting.srrshywk.online 116.62.203.82;

    return 301 https://meeting.srrshywk.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name srrshywk.online www.srrshywk.online;

    ssl_certificate /etc/letsencrypt/live/srrshywk.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srrshywk.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    return 301 https://meeting.srrshywk.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meeting.srrshywk.online;

    ssl_certificate /etc/letsencrypt/live/srrshywk.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srrshywk.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
