services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_room}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meeting_room_password}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meeting_room} -d ${POSTGRES_DB:-meeting_room}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meeting_room:meeting_room_password@db:5432/meeting_room}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - ./staff.csv:/app/staff.csv:ro
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
